[package]
name = "topptic"
version = "0.1.0"
description = "Topptic desktop shell"
authors = ["Topptic"]
edition = "2021"

[lib]
name = "topptic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
rusqlite = { version = "0.32", features = ["bundled"] }
